name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --ignore-scripts
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  # The package's own suites drive a real server, so they run against the reference target in
  # `tests/` rather than against a consumer. Windows is covered because every consumer that runs
  # this gate runs it on a developer's machine as often as in CI, and the harness spawns processes,
  # allocates ports, and writes temp files — all places where Windows differs.
  windows-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --ignore-scripts
      - run: npm run typecheck
      - run: npm run build
